[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-return-assistant"
version = "0.1.0"
description = "Internal tool that prepares DRAFT Australian individual tax returns, sourced workpapers and review notes. Never lodges."
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pdfplumber>=0.10",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "requests>=2.31",
    "keyring>=24",
    "reportlab>=4.0",
    "flask>=3.0",
    "olefile>=0.46",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The AI reader (off unless the privacy officer approves it). Not needed otherwise.
ai = ["anthropic>=1.0"]

[project.scripts]
tra = "tra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
tra = ["web/templates/*.html", "web/static/*"]

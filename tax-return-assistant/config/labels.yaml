# Internal label keys mapped to the ATO individual return (2026 instructions).
# Item numbers and descriptions are the reliable reference. Label LETTERS are
# from the instructions but have not been checked against the 2026 forms:
# letter_verified stays false until a registered agent confirms each one.
#
# role: how the calculation treats the amount
#   income | franking | deduction | rental_income | rental_deduction |
#   business_income | business_deduction | loss | withheld | phi | it | cgt | info
# tab: the workpaper tab the figures appear on. order: ATO item order.

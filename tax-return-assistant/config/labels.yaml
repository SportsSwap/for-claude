# Internal label keys mapped to the ATO individual return (2026 instructions).
# Item numbers and descriptions are the reliable reference. Label LETTERS are
# from the instructions but have not been checked against the 2026 forms:
# letter_verified stays false until a registered agent confirms each one.
#
# role: how the calculation treats the amount
#   income | franking | deduction | rental_income | rental_deduction |
#   business_income | business_deduction | loss | withheld | phi | it | cgt | info
# tab: the workpaper tab the figures appear on, named and numbered like the firm's workpapers
# (several labels can share a tab, e.g. D7 and D8). order: ATO item order.
income.salary:            {item: "1",  label: "C", description: "Salary or wages – gross payments", role: income, tab: "01 Salaries and Wages", order: 10}
income.salary_tax_withheld: {item: "1", label: "Tax withheld", description: "Salary or wages – tax withheld", role: withheld, tab: "01 Salaries and Wages", order: 11}
income.allowances:        {item: "2",  label: "K", description: "Allowances, earnings, tips, director's fees", role: income, tab: "01 Salaries and Wages", order: 20}
it.rfb:                   {item: "IT1", label: "", description: "Total reportable fringe benefits amounts", role: it, tab: "01 Salaries and Wages", order: 25}
it.resc:                  {item: "IT2", label: "", description: "Reportable employer superannuation contributions", role: it, tab: "01 Salaries and Wages", order: 26}
income.interest:          {item: "10", label: "L", description: "Gross interest", role: income, tab: "10 Interest Received", order: 100}

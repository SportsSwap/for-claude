    - {from: 100175, rate: 0.06}
    - {from: 106186, rate: 0.065}
    - {from: 112557, rate: 0.07}
    - {from: 119310, rate: 0.075}
    - {from: 126468, rate: 0.08}
    - {from: 134057, rate: 0.085}
    - {from: 142101, rate: 0.09}
